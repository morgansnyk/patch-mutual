# Snyk API & Web scan settings for THIS repository.
# Read by .github/workflows/scan-existing-target.yml, which can be run here or
# called from any repo as a shared ("global") workflow. Each repo keeps its own copy
# of this file, so each repo scans its own target with its own settings.
#
# Precedence for target_id and fail_on: workflow input > this file > repo variable
# EXISTING_TARGET_ID / default.

# Which Snyk API & Web target to scan (the ID from the target's URL).
target_id: 3euj5LTwKwh3

# Fail the pipeline if the scan finds this severity or worse:
# none | critical | high | medium | low
fail_on: none

# Everything under "scan" is passed to the CLI (targets start-scan -f) and sent as the
# body of Snyk API & Web's "scan now" API call, so it accepts the fields documented
# for that endpoint: https://developers.probely.com/
scan:
  # Built-in profiles: lightning (under a minute), safe, normal, full.
  # A custom profile's ID works here too.
  scan_profile: lightning
