# Build patch-mutual, run it in an ephemeral container, and scan it with
# Snyk API & Web (DAST) through a userspace scanning agent running on the runner.
name: Build and Snyk API & Web DAST

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Must match the hostname in the Snyk API & Web target URL (http://patch-mutual:8080).
  APP_HOSTNAME: patch-mutual
  # Userspace scanning agent from Snyk's public examples repo, pinned to a commit
  # and verified by checksum. (The Docker agent needs iptables nat, which hosted
  # runners don't have.)
  AGENT_REPO: Probely/cicd-pipeline-scan-examples
  AGENT_REF: 7639aabaaa78862a3eff6e6aa5a6d15be2bf56a2
  AGENT_BIN: snyk-agent/scanning-agent/farcasterd-linux-amd64-0.4.3
  AGENT_SHA256: 34cc3ec4e89b589bedd60982b4c69a3ec7e4b3973330981459e1e202f92f6d31

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The repo's Gradle 6.5 wrapper needs JDK <= 14 (build.gradle uses archiveName,
      # which Gradle 8 removed). JDK 11 matches the Dockerfile.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build WAR
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: altoromutual-war
          path: build/libs/altoromutual.war
          if-no-files-found: error

  dast:
    needs: build
    # Fork PRs have no access to secrets, so skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Only one scan of the target at a time.
    concurrency:
      group: snyk-api-web-dast
      cancel-in-progress: false
    env:
      PROBELY_API_KEY: ${{ secrets.PROBELY_API_KEY }}
      AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
      TARGET_ID: ${{ vars.TARGET_ID }}
      # US region by default (what this tenant's agent reports). Override with the
      # repo variable PROBELY_API_BASE_URL for another region.
      PROBELY_API_BASE_URL: ${{ vars.PROBELY_API_BASE_URL || 'https://api.us.probely.com/' }}
      # Set the repo variable DAST_FAIL_ON_HIGH=true to fail the build on High findings.
      FAIL_ON_HIGH: ${{ vars.DAST_FAIL_ON_HIGH }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets and variables
        run: |
          missing=0
          for v in PROBELY_API_KEY AGENT_TOKEN TARGET_ID; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set"; missing=1; fi
          done
          exit $missing

      - name: Build and run the app
        run: |
          docker build -t patch-mutual .
          docker run -d --name "$APP_HOSTNAME" -p 8080:8080 patch-mutual
          # The agent resolves the target hostname through the runner's /etc/hosts.
          echo "127.0.0.1 $APP_HOSTNAME" | sudo tee -a /etc/hosts

      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            if curl -fs -o /dev/null "http://$APP_HOSTNAME:8080/"; then echo "App is up"; exit 0; fi
            echo "Waiting for the app ($i/60)..."; sleep 5
          done
          echo "::error::App did not become ready"; docker logs "$APP_HOSTNAME" | tail -50; exit 1

      - name: Fetch scanning agent
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AGENT_REPO }}
          ref: ${{ env.AGENT_REF }}
          path: snyk-agent
          sparse-checkout: scanning-agent

      - name: Start Snyk API & Web scanning agent
        run: |
          echo "$AGENT_SHA256  $AGENT_BIN" | sha256sum -c -
          chmod +x "$AGENT_BIN"
          umask 077
          printf '%s' "$AGENT_TOKEN" > "$RUNNER_TEMP/agent.token"
          "$AGENT_BIN" --check-token --token "$RUNNER_TEMP/agent.token"
          nohup "$AGENT_BIN" --debug --token "$RUNNER_TEMP/agent.token" \
            --log "$RUNNER_TEMP/agent.log" > /dev/null 2>&1 &
          echo "AGENT_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for the agent
        run: |
          for i in $(seq 1 20); do
            if ! kill -0 "$AGENT_PID" 2>/dev/null; then
              echo "::error::Scanning agent exited"; cat "$RUNNER_TEMP/agent.log"; exit 1
            fi
            [ -s "$RUNNER_TEMP/agent.log" ] && grep -qiE 'connected|running|established|handshake' "$RUNNER_TEMP/agent.log" && break
            echo "Waiting for the agent ($i/20)..."; sleep 3
          done
          echo "--- agent log (tail) ---"; tail -20 "$RUNNER_TEMP/agent.log"

      - name: Install Snyk API & Web CLI
        run: |
          pip install probely
          probely targets get "$TARGET_ID" > /dev/null   # fails fast on a bad key, region or target ID

      - name: Start scan
        run: |
          SCAN_ID=""
          for i in $(seq 1 20); do
            if SCAN_ID=$(probely targets start-scan "$TARGET_ID" -o IDS_ONLY) && [ -n "$SCAN_ID" ]; then
              echo "Scan started: $SCAN_ID"
              echo "SCAN_ID=$SCAN_ID" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Scan did not start, retrying ($i/20)..."; sleep 5
          done
          echo "::error::Could not start a scan"; exit 1

      - name: Wait for scan to finish
        run: |
          for i in $(seq 1 120); do   # up to 60 minutes
            STATUS=$(probely scans get "$SCAN_ID" -o JSON | jq -r '.status')
            echo "Scan status: $STATUS"
            case "$STATUS" in
              queued|started) sleep 30 ;;
              failed|canceled|cancelled) echo "::error::Scan ended with status $STATUS"; exit 1 ;;
              *) exit 0 ;;
            esac
          done
          echo "::error::Timed out waiting for the scan"; exit 1

      - name: Report findings and apply gate
        run: |
          JSON=$(probely scans get "$SCAN_ID" -o JSON)
          HIGHS=$(echo "$JSON" | jq -r '.highs // 0')
          MEDIUMS=$(echo "$JSON" | jq -r '.mediums // 0')
          LOWS=$(echo "$JSON" | jq -r '.lows // 0')
          {
            echo "### Snyk API & Web DAST scan"
            echo "Scan \`$SCAN_ID\` on target \`$TARGET_ID\`"
            echo ""
            echo "| High | Medium | Low |"
            echo "|---|---|---|"
            echo "| $HIGHS | $MEDIUMS | $LOWS |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "High: $HIGHS  Medium: $MEDIUMS  Low: $LOWS"
          if [ "$HIGHS" -gt 0 ] && [ "$FAIL_ON_HIGH" = "true" ]; then
            echo "::error::$HIGHS High severity finding(s)"; exit 1
          fi

      - name: Logs (on failure)
        if: failure()
        run: |
          echo "--- app ---";   docker logs "$APP_HOSTNAME" 2>&1 | tail -100 || true
          echo "--- agent ---"; tail -100 "$RUNNER_TEMP/agent.log" 2>/dev/null || true

      - name: Clean up
        if: always()
        run: |
          [ -n "$AGENT_PID" ] && kill "$AGENT_PID" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/agent.token"
          docker rm -f "$APP_HOSTNAME" 2>/dev/null || true
