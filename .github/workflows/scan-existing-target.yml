# Start a Snyk API & Web scan on an EXISTING target, using the settings in a YAML file.
# No app is built or started here: the target must already be reachable by Snyk
# (a public URL, or an internal one with a scanning agent already running).
name: Snyk API & Web scan (existing target)

on:
  workflow_dispatch:
    inputs:
      target_id:
        description: Target ID to scan (defaults to the EXISTING_TARGET_ID repo variable)
        required: false
        type: string
      settings_file:
        description: Scan settings YAML in this repo
        required: false
        default: .github/snyk-api-web/scan-settings.yaml
        type: string
      fail_on:
        description: Fail the run if the scan finds this severity or worse
        required: false
        default: none
        type: choice
        options: [ none, critical, high, medium, low ]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: snyk-api-web-existing-${{ inputs.target_id || vars.EXISTING_TARGET_ID }}
      cancel-in-progress: false
    env:
      PROBELY_API_KEY: ${{ secrets.PROBELY_API_KEY }}
      # US region by default. Override with the repo variable PROBELY_API_BASE_URL.
      PROBELY_API_BASE_URL: ${{ vars.PROBELY_API_BASE_URL || 'https://api.us.probely.com/' }}
      TARGET_ID: ${{ inputs.target_id || vars.EXISTING_TARGET_ID }}
      SETTINGS_FILE: ${{ inputs.settings_file }}
      FAIL_ON: ${{ inputs.fail_on }}
    steps:
      - uses: actions/checkout@v4

      - name: Check inputs
        run: |
          missing=0
          if [ -z "$PROBELY_API_KEY" ]; then echo "::error::Secret PROBELY_API_KEY is not set"; missing=1; fi
          if [ -z "$TARGET_ID" ]; then echo "::error::Provide target_id or set the EXISTING_TARGET_ID repo variable"; missing=1; fi
          if [ ! -f "$SETTINGS_FILE" ]; then echo "::error::Settings file not found: $SETTINGS_FILE"; missing=1; fi
          exit $missing

      - name: Install Snyk API & Web CLI
        run: |
          pip install probely
          probely targets get "$TARGET_ID"   # fails fast on a bad key, region or target ID

      - name: Show scan settings
        run: |
          echo "### Scan settings" >> "$GITHUB_STEP_SUMMARY"
          { echo '```yaml'; cat "$SETTINGS_FILE"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat "$SETTINGS_FILE"

      - name: Start scan with settings file
        run: |
          SCAN_ID=""
          for i in $(seq 1 20); do
            if SCAN_ID=$(probely targets start-scan "$TARGET_ID" -f "$SETTINGS_FILE" -o IDS_ONLY) && [ -n "$SCAN_ID" ]; then
              echo "Scan started: $SCAN_ID"
              echo "SCAN_ID=$SCAN_ID" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Scan did not start, retrying ($i/20)..."; sleep 5
          done
          echo "::error::Could not start a scan"; exit 1

      - name: Wait for scan to finish
        run: |
          for i in $(seq 1 220); do   # up to ~110 minutes
            STATUS=$(probely scans get "$SCAN_ID" -o JSON | jq -r '.status')
            echo "Scan status: $STATUS"
            case "$STATUS" in
              completed) exit 0 ;;
              failed|canceled|cancelled|paused) echo "::error::Scan ended with status $STATUS"; exit 1 ;;
              *) sleep 30 ;;   # queued, started, resuming, pausing, ...
            esac
          done
          echo "::error::Timed out waiting for the scan"; exit 1

      - name: Report findings and apply gate
        run: |
          JSON=$(probely scans get "$SCAN_ID" -o JSON)
          C=$(echo "$JSON" | jq -r '.criticals // 0')
          H=$(echo "$JSON" | jq -r '.highs // 0')
          M=$(echo "$JSON" | jq -r '.mediums // 0')
          L=$(echo "$JSON" | jq -r '.lows // 0')
          {
            echo "### Snyk API & Web scan results"
            echo "Scan \`$SCAN_ID\` on target \`$TARGET_ID\`"
            echo ""
            echo "| Critical | High | Medium | Low |"
            echo "|---|---|---|---|"
            echo "| $C | $H | $M | $L |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Critical: $C  High: $H  Medium: $M  Low: $L"
          case "$FAIL_ON" in
            critical) COUNT=$C ;;
            high)     COUNT=$((C + H)) ;;
            medium)   COUNT=$((C + H + M)) ;;
            low)      COUNT=$((C + H + M + L)) ;;
            *)        COUNT=0 ;;
          esac
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::$COUNT finding(s) at or above '$FAIL_ON'"; exit 1
          fi
