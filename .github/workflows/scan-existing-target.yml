# Start a Snyk API & Web scan on an EXISTING target, using settings kept in the repo.
#
# Settings (target ID, scan profile, severity gate) come from a YAML file in the repo
# that runs the workflow (default: .github/snyk-api-web/scan-settings.yaml).
#
# Use it as a shared ("global") workflow: keep this file in one repo and call it from
# others with a settings file of their own:
#
#   jobs:
#     dast:
#       uses: morgansnyk/patch-mutual/.github/workflows/scan-existing-target.yml@main
#       secrets: inherit
#
# No app is built or started: the target must already be reachable by Snyk (a public
# URL, or an internal one with a scanning agent already running).
name: Snyk API & Web scan (existing target)

on:
  workflow_dispatch:
    inputs:
      settings_file:
        description: Settings YAML in this repo (default .github/snyk-api-web/scan-settings.yaml)
        required: false
        default: ''
        type: string
      target_id:
        description: Override target_id from the settings file
        required: false
        default: ''
        type: string
      fail_on:
        description: Override fail_on from the settings file (none, critical, high, medium, low)
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      settings_file:
        description: Settings YAML in the calling repo
        required: false
        default: ''
        type: string
      target_id:
        description: Override target_id from the settings file
        required: false
        default: ''
        type: string
      fail_on:
        description: Override fail_on from the settings file
        required: false
        default: ''
        type: string
    secrets:
      PROBELY_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: snyk-api-web-existing-${{ github.repository }}
      cancel-in-progress: false
    env:
      PROBELY_API_KEY: ${{ secrets.PROBELY_API_KEY }}
      # US region by default. Override with the repo variable PROBELY_API_BASE_URL.
      PROBELY_API_BASE_URL: ${{ vars.PROBELY_API_BASE_URL || 'https://api.us.probely.com/' }}
    steps:
      # In a reusable workflow this checks out the CALLING repo, so its settings file is used.
      - uses: actions/checkout@v4

      - name: Check API key
        run: |
          if [ -z "$PROBELY_API_KEY" ]; then echo "::error::Secret PROBELY_API_KEY is not set"; exit 1; fi

      - name: Install Snyk API & Web CLI
        run: pip install probely

      - name: Load settings
        env:
          CONFIG_FILE: ${{ inputs.settings_file || '.github/snyk-api-web/scan-settings.yaml' }}
          IN_TARGET: ${{ inputs.target_id }}
          IN_FAIL_ON: ${{ inputs.fail_on }}
          VAR_TARGET: ${{ vars.EXISTING_TARGET_ID }}
        run: |
          python3 - <<'PY'
          import os, re, sys, yaml

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          path = os.environ["CONFIG_FILE"]
          cfg = {}
          if os.path.isfile(path):
              cfg = yaml.safe_load(open(path)) or {}
              if not isinstance(cfg, dict):
                  fail(f"{path} must be a YAML mapping")
          else:
              print(f"::notice::No settings file at {path}; using inputs and defaults")

          target = (os.environ.get("IN_TARGET") or str(cfg.get("target_id") or "") or os.environ.get("VAR_TARGET") or "").strip()
          fail_on = (os.environ.get("IN_FAIL_ON") or str(cfg.get("fail_on") or "none")).strip().lower()

          if not re.fullmatch(r"[A-Za-z0-9]{6,32}", target):
              fail("No valid target_id: set it in the settings file, the target_id input, or the EXISTING_TARGET_ID variable")
          if fail_on not in ("none", "critical", "high", "medium", "low"):
              fail(f"fail_on must be none, critical, high, medium or low (got '{fail_on}')")

          scan = cfg.get("scan") or {}
          if not isinstance(scan, dict):
              fail("'scan' in the settings file must be a mapping")

          env_lines = [f"TARGET_ID={target}", f"FAIL_ON={fail_on}"]
          if scan:
              payload = os.path.join(os.environ["RUNNER_TEMP"], "scan-payload.yaml")
              with open(payload, "w") as f:
                  yaml.safe_dump(scan, f, sort_keys=False)
              env_lines.append(f"SCAN_PAYLOAD={payload}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("\n".join(env_lines) + "\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### Scan settings\n")
              f.write(f"- Settings file: `{path}`" + ("" if os.path.isfile(path) else " (not found)") + "\n")
              f.write(f"- Target: `{target}`\n- Fail on: `{fail_on}`\n")
              if scan:
                  f.write("\n```yaml\n" + yaml.safe_dump(scan, sort_keys=False) + "```\n")
          print(f"Target: {target}  Fail on: {fail_on}  Scan settings: {scan or 'none (target defaults)'}")
          PY

      - name: Check target
        run: probely targets get "$TARGET_ID"   # fails fast on a bad key, region or target ID

      - name: Start scan
        run: |
          ARGS=()
          if [ -n "$SCAN_PAYLOAD" ]; then ARGS=(-f "$SCAN_PAYLOAD"); fi
          SCAN_ID=""
          for i in $(seq 1 20); do
            if SCAN_ID=$(probely targets start-scan "$TARGET_ID" "${ARGS[@]}" -o IDS_ONLY) && [ -n "$SCAN_ID" ]; then
              echo "Scan started: $SCAN_ID"
              echo "SCAN_ID=$SCAN_ID" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Scan did not start, retrying ($i/20)..."; sleep 5
          done
          echo "::error::Could not start a scan"; exit 1

      - name: Wait for scan to finish
        run: |
          for i in $(seq 1 220); do   # up to ~110 minutes
            STATUS=$(probely scans get "$SCAN_ID" -o JSON | jq -r '.status')
            echo "Scan status: $STATUS"
            case "$STATUS" in
              completed) exit 0 ;;
              failed|canceled|cancelled|paused) echo "::error::Scan ended with status $STATUS"; exit 1 ;;
              *) sleep 30 ;;   # queued, started, resuming, pausing, ...
            esac
          done
          echo "::error::Timed out waiting for the scan"; exit 1

      - name: Report findings and apply gate
        run: |
          JSON=$(probely scans get "$SCAN_ID" -o JSON)
          C=$(echo "$JSON" | jq -r '.criticals // 0')
          H=$(echo "$JSON" | jq -r '.highs // 0')
          M=$(echo "$JSON" | jq -r '.mediums // 0')
          L=$(echo "$JSON" | jq -r '.lows // 0')
          {
            echo "### Snyk API & Web scan results"
            echo "Scan \`$SCAN_ID\` on target \`$TARGET_ID\`"
            echo ""
            echo "| Critical | High | Medium | Low |"
            echo "|---|---|---|---|"
            echo "| $C | $H | $M | $L |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Critical: $C  High: $H  Medium: $M  Low: $L"
          case "$FAIL_ON" in
            critical) COUNT=$C ;;
            high)     COUNT=$((C + H)) ;;
            medium)   COUNT=$((C + H + M)) ;;
            low)      COUNT=$((C + H + M + L)) ;;
            *)        COUNT=0 ;;
          esac
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::$COUNT finding(s) at or above '$FAIL_ON'"; exit 1
          fi
